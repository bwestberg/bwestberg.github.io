<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Tree</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Family Tree</h1>

  <!-- Layout Toggle -->
  <div id="layout-menu">
    <button data-layout="vertical">Vertical Family View</button>
    <button data-layout="horizontal">Horizontal Pedigree View</button>
  </div>

  <!-- Focus Reset -->
  <div id="focus-menu">
    <button id="clear-focus">Back to Full Tree</button>
  </div>

  <!-- Branch Filter Menu -->
  <div id="branch-menu">
    <button data-branch="All">All</button>
    <button data-branch="Westberg">Westberg</button>
    <button data-branch="Losie">Losie</button>
    <button data-branch="Lakin">Lakin</button>
    <button data-branch="Sawyer">Sawyer</button>
  </div>

  <!-- Zoom Controls -->
  <div id="zoom-controls">
    <button id="zoom-out" type="button" aria-label="Zoom out">-</button>
    <button id="zoom-reset" type="button">100%</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
  </div>

  <!-- Tree Display Container -->
  <div id="tree-viewport">
    <div id="tree"></div>
  </div>

  <script type="module" src="tree.js"></script>

</body>
</html>
