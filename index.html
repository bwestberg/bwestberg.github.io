<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Westberg Family Tree</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Westberg Family Tree</h1>

<!-- GLOBAL TREE STYLE DROPDOWN -->
<div class="toolbar">
    <label for="treeStyle"><strong>Tree Style:</strong></label>
    <select id="treeStyle">
        <option value="horizontal">Horizontal Pedigree</option>
        <option value="vertical">Vertical Generational</option>
        <option value="accordion">Accordion Tree</option>
        <option value="multiroot">Side-by-Side Multi-Root</option>
        <option value="radial">Radial Tree</option>
        <option value="layered">Layered Tree</option>
    </select>
</div>

<!-- SEARCH -->
<div class="toolbar">
    <input id="searchInput" type="text" placeholder="Search names...">
    <div id="searchResults"></div>
</div>

<!-- MAIN TREE BUTTONS -->
<div class="toolbar">
    <button id="treeView">Main Tree</button>
    <button id="expandAll">Expand All</button>
    <button id="collapseAll">Collapse All</button>
</div>

<!-- ANCESTRY DISPLAYS -->
<h2>Ancestry Views</h2>

<div class="toolbar">
    <button id="ancestorTree">Ancestor Tree</button>
    <button id="ancestorList">Ancestor List</button>
</div>

<div class="toolbar">
    <button id="generationTree">Generational Tree</button>
    <button id="generationList">Generational List</button>
</div>

<div class="toolbar">
    <button id="surnameTree">Surname Tree</button>
    <button id="surnameList">Surname List</button>
</div>

<div class="toolbar">
    <button id="descendantTree">Descendant Tree</button>
    <button id="descendantList">Descendant List</button>
</div>

<!-- BRANCH FILTERS -->
<h2>Branch Filters</h2>

<div class="toolbar">
    <select id="branchTreeView">
        <option value="">Branch Tree</option>
        <option value="Westberg">Westberg</option>
        <option value="Hornstrom">Hornstrom</option>
        <option value="LaFever">LaFever</option>
        <option value="Raymond">Raymond</option>
        <option value="Losie">Losie</option>
        <option value="Losee">Losee</option>
        <option value="Koeck">Koeck</option>
        <option value="Denton">Denton</option>
        <option value="VanFlaesbeck">VanFlaesbeck</option>
        <option value="Bearance">Bearance</option>
        <option value="Woodman">Woodman</option>
        <option value="Lamberton">Lamberton</option>
        <option value="Lakin">Lakin</option>
        <option value="Meade">Meade</option>
        <option value="Sawyer">Sawyer</option>
        <option value="Brown">Brown</option>
        <option value="Chase">Chase</option>
        <option value="Ingalls">Ingalls</option>
        <option value="Delano">Delano</option>
        <option value="O'Connell">O'Connell</option>
    </select>

    <select id="branchListView">
        <option value="">Branch List</option>
        <option value="Westberg">Westberg</option>
        <option value="Hornstrom">Hornstrom</option>
        <option value="LaFever">LaFever</option>
        <option value="Raymond">Raymond</option>
        <option value="Losie">Losie</option>
        <option value="Losee">Losee</option>
        <option value="Koeck">Koeck</option>
        <option value="Denton">Denton</option>
        <option value="VanFlaesbeck">VanFlaesbeck</option>
        <option value="Bearance">Bearance</option>
        <option value="Woodman">Woodman</option>
        <option value="Lamberton">Lamberton</option>
        <option value="Lakin">Lakin</option>
        <option value="Meade">Meade</option>
        <option value="Sawyer">Sawyer</option>
        <option value="Brown">Brown</option>
        <option value="Chase">Chase</option>
        <option value="Ingalls">Ingalls</option>
        <option value="Delano">Delano</option>
        <option value="O'Connell">O'Connell</option>
    </select>
</div>

<!-- TREE DISPLAY -->
<div id="tree"></div>

<!-- PERSON MODAL -->
<div id="personModal" class="hidden">
    <div class="modal-content">
        <h2 id="modalName"></h2>
        <p id="modalBranch"></p>
        <p id="modalBirth"></p>
        <p id="modalDeath"></p>
        <p id="modalParents"></p>
        <p id="modalSpouses"></p>
        <p id="modalChildren"></p>
        <p id="modalNotes"></p>
        <button id="closeModal">Close</button>
    </div>
</div>

<script src="tree.js"></script>

</body>
</html>
